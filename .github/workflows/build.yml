name: Build

# - Every push to main and every pull request: builds Windows + macOS.
#   The downloads appear under "Artifacts" at the bottom of the run page (Actions tab).
# - Push to main with a new version in Cargo.toml: creates the release vX.Y.Z with
#   the downloads attached (the README download buttons always point to the latest one).
# - Run it by hand (Actions > Build > Run workflow) with "Replace the release" ticked to rebuild
#   the release of the current version from scratch, with the same version number.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      replace_release:
        description: "Replace the release of the current version with a fresh build"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          # Fixed name, so the README link .../releases/latest/download/FLeeker-windows.exe always works
          cp target/release/FLeeker.exe dist/FLeeker-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FLeeker-windows
          path: dist/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Create FLeeker.app
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=dist/FLeeker.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # One binary that runs on both Apple Silicon and Intel Macs
          lipo -create -output "$APP/Contents/MacOS/FLeeker" \
            target/aarch64-apple-darwin/release/FLeeker \
            target/x86_64-apple-darwin/release/FLeeker

          # App icon
          ICONSET=dist/FLeeker.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-mac.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon-mac.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/FLeeker.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>FLeeker</string>
            <key>CFBundleDisplayName</key><string>FLeeker</string>
            <key>CFBundleIdentifier</key><string>io.github.fleeker</string>
            <key>CFBundleExecutable</key><string>FLeeker</string>
            <key>CFBundleIconFile</key><string>FLeeker</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc signature (no Apple Developer account needed)
          codesign --force --deep --sign - "$APP"

          cd dist
          ditto -c -k --keepParent FLeeker.app FLeeker-macos.zip
      - name: Create FLeeker-macos.dmg
        run: |
          # The classic install window: the app on the left, an arrow, the Applications folder on the right
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild
          tiffutil -cathidpicheck assets/dmg/background.png assets/dmg/background@2x.png -out dist/dmg-background.tiff
          cat > dist/dmg-settings.py <<'EOF'
          files = ["dist/FLeeker.app"]
          symlinks = {"Applications": "/Applications"}
          icon = "dist/FLeeker.app/Contents/Resources/FLeeker.icns"
          background = "dist/dmg-background.tiff"
          window_rect = ((200, 160), (640, 428))
          default_view = "icon-view"
          show_status_bar = False
          show_tab_view = False
          show_toolbar = False
          show_pathbar = False
          show_sidebar = False
          icon_size = 128
          text_size = 13
          icon_locations = {"FLeeker.app": (160, 190), "Applications": (480, 190)}
          hide_extension = ["FLeeker.app"]
          format = "UDZO"
          EOF
          "$RUNNER_TEMP/dmg/bin/dmgbuild" -s dist/dmg-settings.py "FLeeker" dist/FLeeker-macos.dmg
          hdiutil verify dist/FLeeker-macos.dmg
          rm -rf dist/FLeeker.app dist/FLeeker.iconset dist/dmg-background.tiff dist/dmg-settings.py
      - uses: actions/upload-artifact@v4
        with:
          name: FLeeker-macos
          path: |
            dist/*.zip
            dist/*.dmg

  release:
    needs: [windows, macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        id: v
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.replace_release }}" = "true" ]; then
            echo "Replacing release v$VERSION with this build."
            gh release delete "v$VERSION" --cleanup-tag --yes
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists: nothing to publish."
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        if: steps.v.outputs.new == 'true'
        run: |
          VERSION=${{ steps.v.outputs.version }}
          # The section of CHANGELOG.md for this version, then the download instructions
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads
          - **Windows 10/11:** `FLeeker-windows.exe`
          - **macOS 11+ (Apple Silicon & Intel):** `FLeeker-macos.dmg` (or `FLeeker-macos.zip`)

          ### First launch
          - **Windows:** if SmartScreen appears, click *More info* then *Run anyway*.
          - **macOS:** open the .dmg and drag FLeeker onto the Applications folder. The first time,
            right-click FLeeker in Applications and choose *Open*
            (macOS 15+: System Settings, Privacy & Security, *Open Anyway*).

          *Not affiliated with Image-Line.*
          EOF
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: FLeeker ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/FLeeker-windows.exe
            dist/FLeeker-macos.dmg
            dist/FLeeker-macos.zip
