[package]
name = "fleeker"
version = "1.0.0"
edition = "2024"
description = "FLeeker - Sample Seeker for FL Studio: locate moved samples and repair browser favorites"
license = "MIT"

[[bin]]
name = "FLeeker"
path = "src/main.rs"

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "clipboard", "x11", "accesskit"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37.0"
encoding_rs = "0.8.42"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"


[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
